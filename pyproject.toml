[project]
name = "archipelago"
version = "0.1.0"
description = "Toggleable clustering pipeline that uses dEA logs to cluster and build Search Trajectory Networks"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pydantic>=2.8",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "pyyaml>=6.0",
]

[project.scripts]
cluster = "clustering.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clustering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
