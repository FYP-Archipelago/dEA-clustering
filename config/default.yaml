# Use: uv run cluster run-logs/<run> --lsh --birch --denstream -c config/default.yaml
#
# Passing the yaml file as config overrides stage-specific default configuration.
# Every value below is the code default, so this file changes nothing until you edit it.

lsh:
  # How many hash functions must ALL agree for two rows to share a block.
  # More -> harder to agree -> finer partition, more and smaller blocks.
  hashes: 6

  # Width of one slice of the projection line, for real-vector (L2) runs only.
  # Wider -> more points fall in the same slice -> fewer, bigger blocks.
  radius: auto

  # Which percentile of random pair distances "auto" picks the width from.
  # Higher -> wider slices -> fewer, bigger blocks.
  width_percentile: 20.0

  # Bitstring runs sample this many bits per hash instead of one projection.
  # Higher -> longer block key -> more blocks.
  hamming_bit_multiplier: 4

  # Size of the MinHash permutation pool for tour and expression-tree runs.
  # Only the first `hashes` are used, so changing this shuffles which functions
  # you get, but does not make blocks finer or coarser.
  num_perm: 128

birch:
  # The furthest a point can sit from a subcluster's centre and still join it.
  # Bigger -> points merge more readily -> fewer, larger nodes.
  threshold: auto

  # How many children a CF-tree node holds before it splits.
  # Higher -> shallower tree, slightly fewer subclusters.
  branching_factor: 50

denstream:
  # The furthest a point can sit from a micro-cluster's centre and still join it.
  # Bigger -> merges across a wider area -> far fewer nodes.
  epsilon: auto

  # Sets the survival bar for a micro-cluster, together with beta.
  # Higher -> harder to survive -> MORE pruning, not less.
  mu: 10.0

  # Scales the survival bar: a cluster must hold weight beta * mu to escape pruning.
  # Higher -> higher bar -> more pruning. beta * mu <= 1 turns pruning off entirely.
  beta: 0.5

  # How long a point's contribution takes to count for half, in units of the clock.
  # Shorter -> the past fades faster -> more pruning, fewer surviving clusters.
  half_life: auto

  # Which time axis points are aged along: arrival | t_wall | generation.
  # t_wall is corrected by each island's clock_offset_ns and is the only one comparable across islands; 
  # arrival is row order; generation is per island.
  clock: t_wall

layout:
  # How node centroids are projected to 3D: none | pca | mds.
  # pca is linear and suits real vectors; mds suits tours and trees; none skips positions.
  method: pca

  # How many points classical MDS embeds exactly before extending to the rest.
  # Higher -> more faithful projection, but the cost grows with the square of this.
  mds_landmarks: 1500

calibration:
  # How many rows are sampled when resolving any "auto" distance.
  # Higher -> steadier, more repeatable thresholds, but slower to compute.
  sample_size: 2000

  # Which percentile of nearest-neighbour distance becomes the BIRCH and DenStream radius.
  # Higher -> bigger radius -> more merging -> fewer nodes.
  percentile: 50.0

# Seeds the LSH projections, the MinHash permutations and the calibration sampling.
# Keeping it fixed is what makes the same logs & the same config give the same STN.
seed: 0
